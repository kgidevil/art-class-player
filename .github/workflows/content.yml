name: SAI reviewed content publication
on:
  push:
    branches: [main]
    paths:
      - 'content/approved.json'
      - 'scripts/content-core.mjs'
      - 'scripts/publish-content.mjs'
      - '.github/workflows/content.yml'
  schedule:
    - cron: '30 0 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sai-content-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run test:content
      - run: npm run content:check
      - run: npm run content:publish
      - run: npm run content:check
      - name: Commit validated catalog only
        shell: bash
        run: |
          if git diff --quiet -- public/content/catalog.json; then
            echo "No new verified items to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/catalog.json
          git commit -m "content: publish reviewed SAI reference pack"
          git push origin HEAD:main
          git ls-remote origin refs/heads/main
